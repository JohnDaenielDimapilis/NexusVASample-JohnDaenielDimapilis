name: App checks

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-flow:
    name: Branch flow
    runs-on: ubuntu-latest
    steps:
      - name: Require owner-led develop-to-main releases
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$BASE_BRANCH" == "main" ]]; then
            if [[ "$HEAD_BRANCH" != "develop" || "$HEAD_REPOSITORY" != "$REPOSITORY" || "$PR_AUTHOR" != "Seperoth" ]]; then
              echo "::error::Contributor changes must target develop. Only @Seperoth opens release PRs from this repository's develop to main after verification."
              exit 1
            fi
            echo "Owner-led develop-to-main release PR."
          else
            echo "Development or push checks; no release promotion requested."
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Tests, types, and development build
        run: npm run check
      - name: Production compilation check (no live backend or deployment)
        run: npm run build
        env:
          VITE_DATA_MODE: supabase
          VITE_SUPABASE_URL: https://build-check-only.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_build_check_only_not_a_real_key
