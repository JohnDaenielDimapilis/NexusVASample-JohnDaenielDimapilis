name: App checks

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Tests, types, and development build
        run: npm run check
      - name: Production compilation check (no live backend or deployment)
        run: npm run build
        env:
          VITE_DATA_MODE: supabase
          VITE_SUPABASE_URL: https://build-check-only.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_build_check_only_not_a_real_key
