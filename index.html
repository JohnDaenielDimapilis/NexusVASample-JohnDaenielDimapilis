<!doctype html>
<html lang="en" data-design="neumorphism">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#2D1B61" />
    <script>
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem("nexusva.appearance");
        } catch {}
        const appearance = saved === "light" || saved === "dark"
          ? saved
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.appearance = appearance;
        document.documentElement.style.colorScheme = appearance;
      })();
    </script>
    <meta
      name="description"
      content="Nexus VA client and assistant workspace. Manage service requests, conversations, appointments, and deliveries."
    />
    <title>NexusVA Test Version 1.3.5</title>
    <link rel="icon" type="image/png" href="/nexus-mark.png" />
    <link rel="stylesheet" href="/neumorphism-v1344.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
